name: Release to Maven Central

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, without a v prefix"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: maven-central-release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish artifacts
    runs-on: macos-latest
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up build
        uses: ./.github/actions/setup-gradle

      - name: Resolve release version
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            if [[ "${GITHUB_REF}" != "refs/heads/${DEFAULT_BRANCH}" ]]; then
              echo "Snapshots must be dispatched from ${DEFAULT_BRANCH}, not ${GITHUB_REF}." >&2
              exit 1
            fi
            RELEASE_VERSION="${INPUT_VERSION}"
            if [[ ! "${RELEASE_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+-SNAPSHOT$ ]]; then
              echo "Manual runs only accept MAJOR.MINOR.PATCH-SNAPSHOT versions." >&2
              exit 1
            fi
            echo "IS_SNAPSHOT=true" >> "${GITHUB_ENV}"
          else
            if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Stable release tags must use vMAJOR.MINOR.PATCH." >&2
              exit 1
            fi
            RELEASE_VERSION="${GITHUB_REF_NAME#v}"

            git fetch origin "${DEFAULT_BRANCH}"
            if ! git merge-base --is-ancestor HEAD "origin/${DEFAULT_BRANCH}"; then
              echo "Release tag ${GITHUB_REF_NAME} is not on ${DEFAULT_BRANCH}." >&2
              exit 1
            fi

            RELEASE_NOTES_PATH="${RUNNER_TEMP}/release-notes.md"
            awk -v version="${RELEASE_VERSION}" '
              index($0, "## " version " - ") == 1 { found = 1; next }
              found && /^## / { exit }
              found { print }
              END { if (!found) exit 2 }
            ' CHANGELOG.md > "${RELEASE_NOTES_PATH}"
            if ! grep -q '[^[:space:]]' "${RELEASE_NOTES_PATH}"; then
              echo "CHANGELOG.md has no release notes for ${RELEASE_VERSION}." >&2
              exit 1
            fi
            echo "RELEASE_NOTES_PATH=${RELEASE_NOTES_PATH}" >> "${GITHUB_ENV}"
            echo "IS_SNAPSHOT=false" >> "${GITHUB_ENV}"
          fi
          echo "RELEASE_VERSION=${RELEASE_VERSION}" >> "${GITHUB_ENV}"

      - name: Build and test
        run: ./gradlew :elevenlabs:build
        env:
          ORG_GRADLE_PROJECT_VERSION_NAME: ${{ env.RELEASE_VERSION }}

      - name: Upload snapshot to Maven Central
        if: env.IS_SNAPSHOT == 'true'
        run: ./gradlew :elevenlabs:publishToMavenCentral --no-configuration-cache
        env:
          ORG_GRADLE_PROJECT_VERSION_NAME: ${{ env.RELEASE_VERSION }}
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}

      - name: Publish release to Maven Central
        if: env.IS_SNAPSHOT == 'false'
        run: ./gradlew :elevenlabs:publishAndReleaseToMavenCentral --no-configuration-cache
        env:
          ORG_GRADLE_PROJECT_VERSION_NAME: ${{ env.RELEASE_VERSION }}
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}

  github-release:
    name: Create GitHub release
    if: github.event_name == 'push'
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Extract release notes
        shell: bash
        run: |
          RELEASE_VERSION="${GITHUB_REF_NAME#v}"
          RELEASE_NOTES_PATH="${RUNNER_TEMP}/release-notes.md"
          awk -v version="${RELEASE_VERSION}" '
            index($0, "## " version " - ") == 1 { found = 1; next }
            found && /^## / { exit }
            found { print }
            END { if (!found) exit 2 }
          ' CHANGELOG.md > "${RELEASE_NOTES_PATH}"
          if ! grep -q '[^[:space:]]' "${RELEASE_NOTES_PATH}"; then
            echo "CHANGELOG.md has no release notes for ${RELEASE_VERSION}." >&2
            exit 1
          fi
          echo "RELEASE_VERSION=${RELEASE_VERSION}" >> "${GITHUB_ENV}"
          echo "RELEASE_NOTES_PATH=${RELEASE_NOTES_PATH}" >> "${GITHUB_ENV}"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --verify-tag \
            --title "ElevenLabs KMP ${RELEASE_VERSION}" \
            --notes-file "${RELEASE_NOTES_PATH}"

  documentation:
    name: Publish release documentation
    if: github.event_name == 'push'
    needs: publish
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/docs.yml
    with:
      deploy: true
